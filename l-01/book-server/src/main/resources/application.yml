spring:
  application:
    name: book-server
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/books_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASS:rootpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false